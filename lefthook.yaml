# Split by speed so the tight commit loop stays fast, while the CI-equivalent
# checks still run locally, synchronously, before code leaves the machine —
# a stale-test regression previously went unnoticed on main for a week
# because CI was the only loop checking it and a red remote check is easy
# to ignore.
pre-commit:
  commands:
    gitleaks:
      run: gitleaks git --staged --no-banner --redact --verbose
    json-validate:
      glob: "*.json"
      run: jq empty {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x --severity=warning {staged_files}
    rules-paths-sync:
      run: bash tests/rules-paths-sync.sh
    symlinked-sync:
      run: bash tests/symlinked-sync.sh
    cloud-manifest-sync:
      run: bash tests/cloud-manifest-sync.sh
    contract-markers-sync:
      run: bash tests/contract-markers-sync.sh
    pi-agents-sync:
      run: bash tests/pi-agents-sync.sh
    coding-guidelines-pin:
      # Reads the pinned files over the network when no local checkout has
      # the commit, so it runs only when the pin itself changes; CI runs it
      # on every push.
      glob: "claude-code/cloud/coding-guidelines.*"
      run: bash tests/coding-guidelines-pin.sh

pre-push:
  commands:
    shellcheck:
      run: bash tests/shellcheck.sh
    shguard-parity-check:
      # flake.lock pins the shguard binary the suite replays through.
      glob:
        - "claude-code/shguard/**"
        - "tests/shguard-parity-check.sh"
        - "nix-darwin/flake.lock"
        - "nix-darwin/shguard.nix"
      run: bash tests/shguard-parity-check.sh
    bun-test:
      glob: "claude-code/{hooks,lib}/*.ts"
      run: bun test claude-code/hooks claude-code/lib
    skill-test:
      glob: "claude-code/skills/**/*.ts"
      run: bun test claude-code/skills
    mod-test:
      glob: "claude-code/mod/**"
      run: claude plugin test claude-code/mod
    pi-test:
      # Not only pi/**: pi extensions and tests load these files from claude-code.
      glob:
        - "pi/**"
        - "claude-code/hooks/slop-guard.ts"
        - "claude-code/hooks/block-config-edit.sh"
        - "claude-code/mod/hooks/rule-guards.ts"
        - "claude-code/mod/hooks/shell-canon.ts"
        - "claude-code/agents/code-reviewer.md"
        - "claude-code/rules/**"
        - "claude-code/lib/**"
      run: bun test pi/tests
    ja-lint-test:
      glob: "claude-code/skills/ja-lint/**"
      run: python3 -I claude-code/skills/ja-lint/scripts/test_yomiyasu_lint.py
