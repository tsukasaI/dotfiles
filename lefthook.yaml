# Split by speed so the tight commit loop stays fast, while the CI-equivalent
# checks still run locally, synchronously, before code leaves the machine —
# a stale-test regression (tests/hooks-regression.sh vs block-config-edit.sh
# drifting apart) previously went unnoticed on main for a week because CI was
# the only loop checking it and a red remote check is easy to ignore.
pre-commit:
  commands:
    gitleaks:
      run: gitleaks git --staged --no-banner --redact --verbose
    json-validate:
      glob: "*.json"
      run: jq empty {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x --severity=warning {staged_files}
    rules-paths-sync:
      run: bash tests/rules-paths-sync.sh

pre-push:
  commands:
    shellcheck:
      run: bash tests/shellcheck.sh
    hooks-regression:
      run: bash tests/hooks-regression.sh
