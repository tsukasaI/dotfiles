# Split from ci.yaml so the macos-14 runner (slower, more expensive) only
# runs when nix-darwin config actually changed — not on every hook/skill edit.
name: flake-check

on:
  push:
    branches: [main]
    paths: ["nix-darwin/**"]
  pull_request:
    paths: ["nix-darwin/**"]

permissions:
  contents: read

jobs:
  flake-check:
    # aarch64-darwin evaluation needs an arm64 macOS runner; --no-build keeps
    # it to evaluation only (no package builds on CI minutes).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31.10.7
      - name: nix flake check (evaluation only)
        run: nix flake check ./nix-darwin --no-build
