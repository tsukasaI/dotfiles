# Split from ci.yaml so the macOS runner (slower, more expensive) only
# runs when nix-darwin config actually changed — not on every hook/skill edit.
name: flake-check

on:
  push:
    branches: [main]
    paths: ["nix-darwin/**", ".github/workflows/flake-check.yaml"]
  pull_request:
    paths: ["nix-darwin/**", ".github/workflows/flake-check.yaml"]

permissions:
  contents: read

jobs:
  flake-check:
    # Not `nix flake check --no-build`: it skips module evaluation. The
    # system drvPath forces it while building nothing.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - name: evaluate darwin system (no build)
        run: nix eval --raw ./nix-darwin#darwinConfigurations.Ino-macbook-air.system.drvPath
