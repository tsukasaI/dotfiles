# CI for a live dotfiles repo (#11): the guardrail hooks gate every Bash call
# of the Claude Code sessions that edit this repo, so regressions here have
# machine-wide blast radius. Third-party actions are pinned to commit SHAs
# (renewed by Dependabot, see .github/dependabot.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: shellcheck all shell entrypoints
        run: bash tests/shellcheck.sh

  json-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: every tracked *.json must parse
        run: git ls-files '*.json' | xargs -n1 jq empty

  shguard-parity-check:
    # shguard is the PreToolUse Bash enforcer (claude-code/settings.json calls
    # it directly, see docs/shguard-migration-deltas.md). Build it pinned to
    # the committed flake.lock rev so this job tracks whatever `nix flake
    # update` last pulled, with no separate version to bump by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: build shguard pinned to flake.lock
        run: |
          rev=$(jq -r '.nodes.shguard.locked.rev' nix-darwin/flake.lock)
          out=$(nix build "github:tsukasaI/shguard/$rev" --no-link --print-out-paths)
          echo "$out/bin" >> "$GITHUB_PATH"
      - name: shguard parity check
        run: bash tests/shguard-parity-check.sh

  rules-paths-sync:
    # #43: the paths: frontmatter in atomicity/code-review/data-handling/
    # encoding/error-handling.md is byte-identical by necessity (no include
    # mechanism for per-file frontmatter); catch drift mechanically instead
    # of relying on 5 identical hand-edits staying in sync.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: "rules paths: frontmatter sync check"
        run: bash tests/rules-paths-sync.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
