name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck all shell entrypoints
        run: bash tests/shellcheck.sh

  json-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every tracked *.json must parse
        run: git ls-files '*.json' | xargs -n1 jq empty

  shguard-parity-check:
    # Not a downloaded release: building the derivation nix-darwin installs
    # tracks flake.lock, with no second version to bump by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: build shguard pinned to flake.lock
        run: |
          out=$(nix build ./nix-darwin#packages.x86_64-linux.shguard --no-link --print-out-paths)
          echo "$out/bin" >> "$GITHUB_PATH"
      - name: shguard parity check
        run: bash tests/shguard-parity-check.sh

  rules-paths-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "rules paths: frontmatter sync check"
        run: bash tests/rules-paths-sync.sh

  symlinked-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "SYMLINKED table sync check"
        run: bash tests/symlinked-sync.sh

  cloud-manifest-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cloud manifest sync check
        run: bash tests/cloud-manifest-sync.sh

  contract-markers-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: contract markers sync check
        run: bash tests/contract-markers-sync.sh

  pi-agents-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pi AGENTS.md sync check
        run: bash tests/pi-agents-sync.sh

  coding-guidelines-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: coding-guidelines pin check
        run: bash tests/coding-guidelines-pin.sh

  # Not `claude plugin test claude-code/mod`: the runner has no Claude Code
  # CLI, so that suite stays on lefthook's pre-push.
  bun-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: hooks and lib
        run: bun test claude-code/hooks claude-code/lib
      - name: skills
        run: bun test claude-code/skills
      - name: harness metrics
        run: bun test claude-code/scripts/harness-metrics
      - name: guard hooks
        run: bun test ./tests
      - name: pi
        run: bun test pi/tests

  ja-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ja-lint unit tests
        run: python3 -I claude-code/skills/ja-lint/scripts/test_yomiyasu_lint.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
