# Claude Code PreToolUse blocklist
# Format: CATEGORY | command prefix | Block reason
#
# - Lines starting with # are comments. Blank lines are ignored.
# Pattern types:
#   prefix      → blocked at word boundary (e.g. "rm" blocks "rm foo" but not "remove-items")
#   prefix*     → starts-with match, no end boundary (e.g. "mkfs*" blocks "mkfs.ext4")
#   *keyword*   → contains anywhere in the command (e.g. "*secret*")
# To add a rule: add a line. To remove: delete or comment it out.

# ── Privilege escalation ──────────────────────────────────────────────────────
PRIVILEGE         | sudo              | sudo grants root-level access
PRIVILEGE         | su                | su switches to another user account
PRIVILEGE         | doas              | doas grants elevated privileges

# ── File destruction ──────────────────────────────────────────────────────────
FILE_DESTRUCTION  | rm                | rm permanently deletes files
FILE_DESTRUCTION  | shred             | shred securely wipes file data
FILE_DESTRUCTION  | truncate          | truncate zeroes out file contents

# ── Disk operations ───────────────────────────────────────────────────────────
DISK_OPERATION    | dd                | dd can overwrite raw disk blocks
DISK_OPERATION    | mkfs*             | mkfs / mkfs.ext4 etc. creates a new filesystem, destroying data
DISK_OPERATION    | fdisk             | fdisk edits partition tables
DISK_OPERATION    | gdisk             | gdisk edits partition tables
DISK_OPERATION    | parted            | parted edits partition tables
DISK_OPERATION    | diskutil erase    | diskutil erase permanently destroys disk data

# ── Network exfiltration ──────────────────────────────────────────────────────
NETWORK           | netcat            | netcat opens raw TCP/UDP connections
NETWORK           | nc                | alias of netcat
NETWORK           | wget              | wget can download or exfiltrate data to/from external hosts
# Note: curl is handled separately in the script (localhost is allowed)

# ── Process / service manipulation ───────────────────────────────────────────
PROCESS           | kill              | kill terminates system or user processes
PROCESS           | pkill             | pkill terminates processes by name
PROCESS           | killall           | killall terminates all matching processes
SERVICE           | launchctl load    | launchctl can load/alter macOS system services
SERVICE           | launchctl unload  | launchctl can unload macOS system services
SERVICE           | systemctl enable  | systemctl can alter Linux system services
SERVICE           | systemctl start   | systemctl can start Linux system services
SERVICE           | systemctl stop    | systemctl can stop Linux system services
SERVICE           | systemctl disable | systemctl can disable Linux system services

# ── Credential and secret file access ────────────────────────────────────────
# Prefix *...*  means "contains anywhere in the command" (not just at the start)
CREDENTIAL        | *secret*          | Command references something named 'secret'
CREDENTIAL        | *credential*      | Command references something named 'credential'
CREDENTIAL        | cat .env          | .env files may contain secrets
CREDENTIAL        | cat id_rsa        | SSH private key file
CREDENTIAL        | cat id_ed25519    | SSH private key file

# ── Environment variable exfiltration ────────────────────────────────────────
# `set`, `env`, `export` were removed: they false-positive on `set -euo pipefail`,
# `env VAR=x cmd`, `export FOO=bar`. Network egress (curl/wget/dev-tcp/pipe-to-shell)
# is blocked separately, so local env enumeration alone cannot exfiltrate.
ENV_EXFIL         | printenv          | printenv dumps env vars that may include secrets

# ── Shell escape / code injection ─────────────────────────────────────────────
CODE_INJECTION    | eval              | eval executes arbitrary strings as shell code
CODE_INJECTION    | bash -c           | bash -c executes an arbitrary script string
CODE_INJECTION    | sh -c             | sh -c executes an arbitrary script string
CODE_INJECTION    | zsh -c            | zsh -c executes an arbitrary script string
CODE_INJECTION    | dash -c           | dash -c executes an arbitrary script string
CODE_INJECTION    | ksh -c            | ksh -c executes an arbitrary script string
CODE_INJECTION    | fish -c           | fish -c executes an arbitrary script string
CODE_INJECTION    | bash              | bash invocation (heredoc / script file can run arbitrary code)
CODE_INJECTION    | sh                | sh invocation (heredoc / script file can run arbitrary code)
CODE_INJECTION    | zsh               | zsh invocation
CODE_INJECTION    | xargs             | xargs can invoke arbitrary executables (e.g. xargs sh -c)

# ── Interpreter shell-out (-c / -e flag executes arbitrary code) ─────────────
CODE_INJECTION    | python -c         | python -c executes an arbitrary string as Python
CODE_INJECTION    | python3 -c        | python3 -c executes an arbitrary string as Python
CODE_INJECTION    | node -e           | node -e executes an arbitrary string as JavaScript
CODE_INJECTION    | perl -e           | perl -e executes an arbitrary string as Perl
CODE_INJECTION    | ruby -e           | ruby -e executes an arbitrary string as Ruby
CODE_INJECTION    | php -r            | php -r executes an arbitrary string as PHP

# Heredoc to interpreter — feeds a script body that bypasses argv inspection
CODE_INJECTION    | python <<*        | python <<EOF heredoc executes arbitrary script body
CODE_INJECTION    | python3 <<*       | python3 <<EOF heredoc executes arbitrary script body
CODE_INJECTION    | node <<*          | node <<EOF heredoc executes arbitrary script body
CODE_INJECTION    | perl <<*          | perl <<EOF heredoc executes arbitrary script body
CODE_INJECTION    | ruby <<*          | ruby <<EOF heredoc executes arbitrary script body
CODE_INJECTION    | php <<*           | php <<EOF heredoc executes arbitrary script body

# Source / dot — load a script file's contents into the current shell
CODE_INJECTION    | source            | source loads and executes a file's contents in the current shell

# macOS osascript can run shell via "do shell script"
CODE_INJECTION    | osascript -e      | osascript -e runs an arbitrary AppleScript that can shell out
CODE_INJECTION    | osascript         | osascript can run AppleScript files that shell out

# socat — bidirectional data channel, frequent egress / shell tunnel tool
NETWORK           | socat             | socat opens arbitrary network channels and reverse shells

# ── DNS-based exfiltration channels ──────────────────────────────────────────
NETWORK           | dig               | dig can leak data to attacker-controlled DNS via subdomain queries
NETWORK           | nslookup          | nslookup can leak data via subdomain DNS queries
NETWORK           | host              | host can leak data via subdomain DNS queries
NETWORK           | drill             | drill can leak data via subdomain DNS queries
NETWORK           | delv              | delv can leak data via subdomain DNS queries
NETWORK           | getent hosts      | getent hosts triggers DNS resolution that can leak data

# ── Permission / user modification ────────────────────────────────────────────
PERMISSION        | chmod             | chmod changes file permissions
PERMISSION        | chown             | chown changes file ownership
USER              | passwd            | passwd changes user account passwords
USER              | useradd           | useradd creates user accounts
USER              | userdel           | userdel deletes user accounts

# ── Git destructive operations ────────────────────────────────────────────────
# Note: git push --force / -f is handled separately in block-dangerous.sh
#       (--force-with-lease is allowed).
GIT               | git reset         | git reset rewrites history or discards changes
GIT               | git restore       | git restore discards uncommitted working tree changes
GIT               | git rebase        | git rebase rewrites commit history
GIT               | git rm            | git rm removes tracked files
GIT               | git commit --amend | git commit --amend rewrites the previous commit
GIT               | git checkout --   | git checkout -- discards working tree changes
GIT               | git clean         | git clean deletes untracked files
GIT               | git tag -d        | git tag -d deletes a tag
GIT               | git tag -D        | git tag -D force-deletes a tag
GIT               | git tag -a        | git tag -a creates an annotated tag
GIT               | git tag -s        | git tag -s creates a signed tag
GIT               | git tag -f        | git tag -f overwrites an existing tag
GIT               | git branch -d     | git branch -d deletes a branch
GIT               | git branch -D     | git branch -D force-deletes a branch

# ── GitHub CLI destructive operations ─────────────────────────────────────────
GITHUB            | gh pr create      | gh pr create makes an irreversible remote PR
GITHUB            | gh pr comment     | gh pr comment posts to a remote PR
GITHUB            | gh pr edit        | gh pr edit modifies a remote PR
GITHUB            | gh pr close       | gh pr close closes a remote PR
GITHUB            | gh pr merge       | gh pr merge merges a remote PR
GITHUB            | gh issue edit     | gh issue edit modifies a remote issue
GITHUB            | gh issue close    | gh issue close closes a remote issue
GITHUB            | gh issue delete   | gh issue delete permanently deletes a remote issue
GITHUB            | gh repo delete    | gh repo delete permanently deletes a remote repository
GITHUB            | gh release create | gh release create publishes a release

# ── History manipulation ──────────────────────────────────────────────────────
HISTORY           | history -c        | history -c clears shell command history
HISTORY           | history -d        | history -d deletes a history entry

# ── Cron / scheduling ────────────────────────────────────────────────────────
SCHEDULING        | crontab -e        | crontab -e edits the user crontab
SCHEDULING        | crontab -r        | crontab -r removes the user crontab

# ── SSH tunneling ─────────────────────────────────────────────────────────────
SSH               | ssh -L            | ssh -L opens a local port-forwarding tunnel
SSH               | ssh -R            | ssh -R opens a remote port-forwarding tunnel
SSH               | ssh -D            | ssh -D opens a SOCKS proxy tunnel

# ── Tool policy: prefer gitignore-aware tools ────────────────────────────────
TOOL_POLICY       | grep              | grep ignores .gitignore — use rg (or built-in Grep tool) which auto-skips node_modules / dist / target
TOOL_POLICY       | egrep             | egrep is deprecated grep -E — use rg
TOOL_POLICY       | fgrep             | fgrep is deprecated grep -F — use rg -F
TOOL_POLICY       | find              | find ignores .gitignore — use fd (or built-in Glob tool) which auto-skips node_modules / dist / target
