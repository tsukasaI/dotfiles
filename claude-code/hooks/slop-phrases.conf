# Claude Code slop-guard cliché phrase list (English only, v1)
# Format: CATEGORY | phrase | reason | alternative (optional)
# Matching: case-insensitive, word-boundary, literal phrase (no regex metachars)
# Only phrases newly introduced by a tool call are flagged — pre-existing
# occurrences carried through as unchanged context are never counted.
# Source: curated subset of Wikipedia:Signs of AI writing / no-slop / anti-ai-slop-writing.
# To add a rule: add a line. To remove: delete or comment it out.

HEDGE     | it's important to note     | generic AI hedging filler          | state the fact directly
HEDGE     | it is important to note    | generic AI hedging filler          | state the fact directly
HEDGE     | it's worth noting          | generic AI hedging filler          | state the fact directly
INTRO     | in today's fast-paced world | generic AI essay-intro cliché      | delete, start with the actual point
INTRO     | in the ever-evolving       | generic AI essay-intro cliché       | delete, start with the actual point
INTRO     | let's dive in              | generic AI transition filler       | delete, start with the actual point
VERB      | delve into                 | overused AI verb choice            | look into / examine
VERB      | unlock the potential       | overused AI marketing phrase       | remove or be specific
VERB      | navigate the complexities  | overused AI marketing phrase       | remove or be specific
VERB      | seamlessly integrate       | overused AI marketing phrase       | remove or be specific
METAPHOR  | tapestry                   | overused AI metaphor               | remove the metaphor
METAPHOR  | testament to               | overused AI metaphor               | evidence of / shows
ADJ       | boundary-pushing           | overused AI marketing adjective    | remove or be specific
ADJ       | game-changer               | overused AI marketing adjective    | remove or be specific
