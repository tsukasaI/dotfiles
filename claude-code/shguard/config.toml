# =====================================================================
# Allowlisted security scanners (ported from allowlist.conf).
# These tools legitimately read secret-looking files as their normal job.
# NOTE: this is NOT an override mechanism — [[allow]] can never rescue a
# match against a deny rule above. It works here only because none of the
# targets lists above match these four tools' own argv[0] (secretlint/
# detect-secrets/gitleaks/trufflehog aren't cat/head/tail/etc., and none of
# the other deny rules' command names match them either). Kept as explicit
# [[allow]] entries for documentation/audit-trail purposes and to downgrade
# any structural Ask shguard's parser might otherwise raise on their
# invocations (e.g. an argument containing "$(...)").
# =====================================================================

[[allow]]
id = "dotfiles-allow-secretlint"
reason = "secretlint is a secret-scanning tool, not a threat"
command = "secretlint"

[[allow]]
id = "dotfiles-allow-detect-secrets"
reason = "detect-secrets is a secret-scanning tool, not a threat"
command = "detect-secrets"

[[allow]]
id = "dotfiles-allow-gitleaks"
reason = "gitleaks is a secret-scanning tool, not a threat"
command = "gitleaks"

[[allow]]
id = "dotfiles-allow-trufflehog"
reason = "trufflehog is a secret-scanning tool, not a threat"
command = "trufflehog"
# =====================================================================
# Exec-capable search tools (fd/rg are allow-listed in settings.json)
# =====================================================================

[[deny]]
id = "dotfiles-code-fd-exec"
reason = "fd -x/-X/--exec/--exec-batch runs an arbitrary command per match (same class as xargs)"
command = "fd"
required_flags = ["x|X|--exec|--exec-batch"]

# =====================================================================
# Credentials (push-to-turso.sh is intentionally manual)
# =====================================================================

[[deny]]
id = "dotfiles-gh-auth-token"
reason = "gh auth token prints the GitHub token"
command = "gh"
required_tokens = ["auth", "token"]

[[deny]]
id = "dotfiles-gh-auth-status-show-token"
reason = "gh auth status -t/--show-token prints the GitHub token"
command = "gh"
required_tokens = ["auth", "status"]
required_flags = ["t|--show-token"]

[[deny]]
id = "dotfiles-turso"
reason = "turso credentials are deliberately kept out of Claude's process tree; run push-to-turso.sh manually"
command = "turso"

# =====================================================================
# Exfiltration via gh file uploads (gh runs outside the sandbox)
# =====================================================================

# A multi-line -b argument makes Claude Code run the line sandboxed (newlines
# split it, so it no longer matches sandbox.excludedCommands) and gh then
# fails on the keychain, so multi-line bodies must go through --body-file.
# Only a file under the session scratchpad is allowed as the body source.
# target_flags makes the body-file value the only candidate (issue/PR numbers
# and URLs are positionals); resolve_symlinks stops a scratchpad symlink from
# pointing it elsewhere. gh (pflag) has no long-option abbreviation, so the
# two spellings listed are all of them.
[[deny]]
id = "dotfiles-gh-issue-body-file"
reason = "gh issue --body-file uploads a local file; write the body under /private/tmp/claude-501/ first"
command = "gh"
required_tokens = ["issue"]
required_flags = ["F|--body-file"]
value_flags = ["t", "title", "b", "body", "R", "repo", "l", "label", "a", "assignee", "m", "milestone", "p", "project", "T", "template"]
target_flags = ["--body-file", "-F"]
except_targets = [{ prefix = "/private/tmp/claude-501/" }]
resolve_symlinks = true

[[deny]]
id = "dotfiles-gh-pr-body-file"
reason = "gh pr --body-file uploads a local file; write the body under /private/tmp/claude-501/ first"
command = "gh"
required_tokens = ["pr"]
required_flags = ["F|--body-file"]
value_flags = ["t", "title", "b", "body", "R", "repo", "B", "base", "H", "head", "l", "label", "a", "assignee", "r", "reviewer", "m", "milestone", "p", "project", "T", "template"]
target_flags = ["--body-file", "-F"]
except_targets = [{ prefix = "/private/tmp/claude-501/" }]
resolve_symlinks = true

# =====================================================================
# Unsandboxed git (push/fetch/pull/ls-remote run outside the Seatbelt
# sandbox for SSH; see claude-code/settings.json sandbox.excludedCommands)
# =====================================================================

[[deny]]
id = "dotfiles-git-push-url-target"
reason = "git push to a URL or local path instead of a named remote can exfiltrate history or run a local receive-pack"
command = "git"
required_tokens = ["push"]
targets = [
  { prefix = "https://" }, { prefix = "http://" }, { prefix = "ssh://" },
  { prefix = "git://" }, { prefix = "git@" }, { prefix = "file://" },
  { prefix = "ext::" }, { prefix = "/" }, { prefix = "." }, { prefix = "~" },
]

[[deny]]
id = "dotfiles-git-push-delete-refspec"
reason = "git push <remote> :ref deletes the remote ref"
command = "git"
required_tokens = ["push"]
targets = [{ prefix = ":" }]

[[deny]]
id = "dotfiles-git-push-destructive-flags"
reason = "git push --delete/--mirror/--prune deletes remote refs; --receive-pack/--exec runs a chosen command"
command = "git"
required_tokens = ["push"]
required_flags = ["d|--delete|--mirror|--prune|--receive-pack|--exec"]

[[deny]]
id = "dotfiles-git-fetch-upload-pack"
reason = "git fetch --upload-pack runs a chosen command"
command = "git"
required_tokens = ["fetch"]
required_flags = ["--upload-pack"]

[[deny]]
id = "dotfiles-git-pull-upload-pack"
reason = "git pull --upload-pack runs a chosen command"
