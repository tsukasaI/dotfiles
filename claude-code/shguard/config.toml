# shguard 0.10 user policy for this machine.
#
# Deployed to ~/.config/shguard/config.toml (shguard's default lookup path)
# by a setup.sh symlink, so it stays versioned and CI-testable. Merged with
# shguard's embedded catalog (catalog/*.toml in the shguard repository).
#
# How 0.10 decides: Allow needs every simple command covered by a catalog
# row, with no rule hit. Anything without a row is Ask, and a [[rule]] can
# only target a key some row covers. Allow is a claim about what shguard
# read, not that a command is safe (shguard README, promises P1-P3).
#
# Migration from the 0.9 config (docs/shguard-migration-deltas.md, section 27):
# - Every 0.9 [[deny]] on a command without a 0.10 row (sudo, curl, ssh,
#   interpreters, find, most git/gh subcommands, ...) is now an Ask, which
#   ask_outcome below turns into a deny. They are not rewritten here; a rule
#   on them would be a load error (no row can match its key).
# - Rules below restore the 0.9 denies on commands the embedded catalog
#   allows. 0.10 rules carry no reason text: the id is the reason.

# Every Ask is refused: an unresolved Ask stalls an autonomous session, and
# Ask is not a reliable control under bypassPermissions.
ask_outcome = "deny"

# =====================================================================
# Rows: commands the embedded catalog does not cover. Each widens Allow.
# =====================================================================

# The filter is jq's own language: it cannot write files or run programs,
# and reads other files only through `import`/`include` from the default
# module path (~/.jq; -L is left out), so it is inert; the rest are input
# files. User-owned risk: `jq -n env` /
# `$ENV` prints the environment, which can hold API keys. Left out:
# -f/--from-file, -L/--library-path, --slurpfile/--rawfile (read files
# into variables), --arg/--argjson (two values each, which the grammar
# cannot express), --args/--jsonargs (turn the rest into values), --seq,
# --stream*.
[[row]]
key = ["jq"]
source = "https://jqlang.org/manual/v1.8/#invoking-jq"
order = "permute"
dashdash = "ends"
positionals = ["inert"]
rest = "path"
[[row.opt]]
short = "n"
long = "null-input"
[[row.opt]]
short = "R"
long = "raw-input"
[[row.opt]]
short = "s"
long = "slurp"
[[row.opt]]
short = "c"
long = "compact-output"
[[row.opt]]
short = "r"
long = "raw-output"
[[row.opt]]
long = "raw-output0"
[[row.opt]]
short = "j"
long = "join-output"
[[row.opt]]
short = "a"
long = "ascii-output"
[[row.opt]]
short = "S"
long = "sort-keys"
[[row.opt]]
short = "C"
long = "color-output"
[[row.opt]]
short = "M"
long = "monochrome-output"
[[row.opt]]
long = "tab"
[[row.opt]]
long = "indent"
value = { takes = "inert" }
[[row.opt]]
long = "unbuffered"
[[row.opt]]
short = "e"
long = "exit-status"

# ---------------------------------------------------------------------
# git/gh write operations. The policy is "allow what reflog or GitHub can
# undo, block what loses data for good": each row lists the safe options,
# an option that discards work is listed too so a named [[rule]] below
# blocks it (the id is the reason), and anything unlisted stays an Ask.
# Not given rows on purpose: `git checkout` (a branch and `-- path`, which
# discards edits, share one operand slot), `git restore` (a row cannot
# require --staged; unstage with `git reset -- <path>`), `git clean`,
# `git rm`, `git gc`, `git reflog`, `git update-ref`, `git filter-branch`.
# `git branch` keeps the embedded listing-only row (a second row with the
# same key is a load error), so branches are made with `git switch -c`.
# ---------------------------------------------------------------------

# Left out: -f/--force (stages ignored files; gitleaks is the backstop
# only for what it recognizes), -p/-i/-e (interactive, would hang).
[[row]]
key = ["git", "add"]
source = "https://git-scm.com/docs/git-add"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
rest = "path"
opt = [
  { short = "A", long = "all" },
  { short = "u", long = "update" },
  { short = "N", long = "intent-to-add" },
  { short = "v", long = "verbose" },
  { short = "n", long = "dry-run" },
]

# Not -n: in git commit it is --no-verify, which skips the pre-commit
# gitleaks hook, so both spellings stay unlisted (asked, hence denied).
# Not -F/--file: it reads any file (`-F .env`) into a message that a push
# then publishes; repeat -m for a multi-paragraph message.
[[row]]
key = ["git", "commit"]
source = "https://git-scm.com/docs/git-commit"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
rest = "path"
opt = [
  { short = "m", long = "message", value = { takes = "inert" } },
  { short = "a", long = "all" },
  { long = "amend" },
  { long = "no-edit" },
  { long = "fixup", value = { takes = "inert" } },
  { long = "squash", value = { takes = "inert" } },
  { short = "s", long = "signoff" },
  { long = "allow-empty" },
  { long = "author", value = { takes = "inert" } },
  { long = "date", value = { takes = "inert" } },
  { short = "q", long = "quiet" },
  { short = "v", long = "verbose" },
]

# The branch operand is a path word only so rules can see it. Switching
# still overwrites ignored files the target branch tracks (git's default
# --overwrite-ignore); that is accepted.
[[row]]
key = ["git", "switch"]
source = "https://git-scm.com/docs/git-switch"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
rest = "path"
opt = [
