# POST). Also left out: --hostname (another host), --verbose.
[[row]]
key = ["gh", "api"]
source = "https://cli.github.com/manual/gh_api"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
positionals = ["path"]
opt = [
  { long = "paginate" },
  { long = "slurp" },
  { short = "H", long = "header", value = { takes = "inert" } },
  { short = "i", long = "include" },
  { long = "cache", value = { takes = "inert" } },
  { short = "t", long = "template", value = { takes = "inert" } },
  { long = "silent" },
]
# =====================================================================
# Rules: 0.9 denies on commands the embedded catalog covers.
# =====================================================================

# 0.9 dotfiles-file-rm: every rm is refused, not only the catalog's
# dangerous targets.
[[rule]]
id = "dotfiles-file-rm"
key = ["rm"]
outcome = "block"

# 0.9 dotfiles-git-push-url-target: the catalog asks URL and absolute-path
# remotes but allows the scp form (`git@host:path`) and `.`.
[[rule]]
id = "dotfiles-git-push-url-target"
key = ["git", "push"]
targets = [
  { pat = "git@", kind = "prefix" },
  { pat = ".", kind = "exact" },
]
outcome = "block"

# 0.9 dotfiles-rename-protected-ancestor-cp: the catalog blocks cp onto or
# out of .git and .claude, not claude-code (relative paths only; absolute
# and `~` paths are already asked by cp-ask-nonlocal-target).
[[rule]]
id = "dotfiles-rename-protected-ancestor-cp"
key = ["cp"]
targets = [{ pat = "claude-code", kind = "under" }]
outcome = "block"

# 0.9 dotfiles-secret-read-*: the catalog asks `~/...` credential paths and
# `.env`, but has no HOME, so the absolute spelling of the same paths, and
# the bare names the 0.9 rules listed, are allowed. The kernel folds ASCII
# case. Not expressible: a basename at any depth (`sub/.env`, `*.pem`).
# rg and grep take the pattern as a path word, so the bare names would also
# hit `rg id_rsa`: they get the absolute targets only (rg already asks every
# /Users path through rg-ask-broad, so it gets no rule).
[[rule]]
id = "dotfiles-secret-read-cat"
key = ["cat"]
outcome = "block"
targets = [
  { pat = "/Users/inouetsukasa/.ssh", kind = "under" },
  { pat = "/Users/inouetsukasa/.gnupg", kind = "under" },
  { pat = "/Users/inouetsukasa/.aws", kind = "under" },
  { pat = "/Users/inouetsukasa/.config/gh", kind = "under" },
  { pat = "/Users/inouetsukasa/.config/gcloud", kind = "under" },
  { pat = "/Users/inouetsukasa/.claude", kind = "under" },
  { pat = "/Users/inouetsukasa/.claude.json", kind = "exact" },
  { pat = "/Users/inouetsukasa/.kube", kind = "under" },
  { pat = "/Users/inouetsukasa/.docker", kind = "under" },
  { pat = "/Users/inouetsukasa/.netrc", kind = "exact" },
  { pat = "/Users/inouetsukasa/.npmrc", kind = "exact" },
  { pat = "/Users/inouetsukasa/.pypirc", kind = "exact" },
  { pat = "/Users/inouetsukasa/.pgpass", kind = "exact" },
  { pat = "/Users/inouetsukasa/.zsh_history", kind = "exact" },
  { pat = "/Users/inouetsukasa/.bash_history", kind = "exact" },
  { pat = "/Users/inouetsukasa/.pi/agent/auth.json", kind = "exact" },
  { pat = "id_rsa", kind = "exact" },
