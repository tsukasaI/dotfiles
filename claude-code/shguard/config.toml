# =====================================================================
# Secret-file readers — best-effort partial port.
# Old rule matched by filename SUFFIX/extension across any directory depth
# (e.g. any path ending in .pem, .env*, or containing "secret"/"credential"
# with any extension). shguard's `targets` only supports exact/prefix
# matching on the whole argv token, so directory-prefixed paths and
# extension-suffix patterns (*.pem, *.key, *.p12) aren't expressible here —
# only common bare filenames/prefixes are covered. See
# docs/shguard-migration-deltas.md.
# =====================================================================

[[deny]]
id = "dotfiles-secret-read-cat"
reason = "cat reads a file that looks like a secret/credential store"
command = "cat"
targets = [
    { prefix = ".env" }, { prefix = "~/.env" },
    { exact = "id_rsa" }, { exact = "~/.ssh/id_rsa" },
    { exact = "id_ed25519" }, { exact = "~/.ssh/id_ed25519" },
    { exact = "id_ecdsa" }, { exact = "~/.ssh/id_ecdsa" },
    { exact = "id_dsa" }, { exact = "~/.ssh/id_dsa" },
    { exact = "kubeconfig" }, { prefix = ".kube/config" }, { prefix = "~/.kube/config" },
    { exact = ".npmrc" }, { exact = "~/.npmrc" },
    { exact = ".netrc" }, { exact = "~/.netrc" },
    { exact = ".pgpass" }, { exact = "~/.pgpass" },
    { prefix = ".aws/" }, { prefix = "~/.aws/" },
    { exact = ".docker/config.json" }, { exact = "~/.docker/config.json" },
    { prefix = ".config/gcloud/" }, { prefix = "~/.config/gcloud/" },
]

