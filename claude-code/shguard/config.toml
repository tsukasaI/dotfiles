# Not an allowlist of /private/tmp: a rule cannot say "only under", so every
# other root entry is listed (a new root directory needs root on macOS).
# /.vol, /.resolve, /.nofollow and /.file are aliases that reach any file.
[[rule]]
id = "dotfiles-gh-upload-path"
key = ["gh"]
targets = [
  { pat = "/.vol", kind = "under" },
  { pat = "/.resolve", kind = "under" },
  { pat = "/.nofollow", kind = "under" },
  { pat = "/.file", kind = "under" },
  { pat = "/Applications", kind = "under" },
  { pat = "/bin", kind = "under" },
  { pat = "/cores", kind = "under" },
  { pat = "/dev", kind = "under" },
  { pat = "/etc", kind = "under" },
  { pat = "/home", kind = "under" },
  { pat = "/Library", kind = "under" },
  { pat = "/nix", kind = "under" },
  { pat = "/opt", kind = "under" },
  { pat = "/pkg", kind = "under" },
  { pat = "/run", kind = "under" },
  { pat = "/sbin", kind = "under" },
  { pat = "/System", kind = "under" },
  { pat = "/Users", kind = "under" },
  { pat = "/usr", kind = "under" },
  { pat = "/var", kind = "under" },
  { pat = "/Volumes", kind = "under" },
  { pat = "/private/etc", kind = "under" },
  { pat = "/private/var", kind = "under" },
  { pat = "/private/tftpboot", kind = "under" },
  { pat = "~", kind = "prefix" },
  { pat = "..", kind = "under" },
  { pat = ".env", kind = "prefix" },
]
outcome = "block"
# One operand and only --get, so this row reads a value: a second operand,
# --add, --unset, --file, --global, -e and --list all fall outside it. The
# operand takes "path" so dotfiles-git-config-subcommand can see it.
[[row]]
key = ["git", "config"]
source = "https://git-scm.com/docs/git-config"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
positionals = ["path"]
opt = [{ long = "get" }]

# Not --stdin: it reads its paths from a stream the rules cannot see.
[[row]]
key = ["git", "check-ignore"]
source = "https://git-scm.com/docs/git-check-ignore"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
rest = "path"
opt = [
  { short = "v", long = "verbose" },
  { short = "n", long = "non-matching" },
  { short = "q", long = "quiet" },
]

# No operand: a repository operand can name another host, including the
# HOST/OWNER/REPO form that gh-url-operand does not see as a URL. -q/--jq is
# listed only so that gh-jq blocks it with its reason.
[[row]]
key = ["gh", "repo", "view"]
source = "https://cli.github.com/manual/gh_repo_view"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
opt = [
  { short = "q", long = "jq", value = { takes = "inert" } },
  { long = "json", value = { takes = "inert" } },
  { short = "t", long = "template", value = { takes = "inert" } },
]

# Modern git reads these two words as subcommands, so the one-operand row alone
# would open an editor or dump the whole config.
[[rule]]
id = "dotfiles-git-config-subcommand"
key = ["git", "config"]
targets = [
  { pat = "edit", kind = "exact" },
  { pat = "list", kind = "exact" },
]
outcome = "block"
[[row]]
key = ["git", "cherry"]
source = "https://git-scm.com/docs/git-cherry"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
rest = "path"
opt = [
  { short = "v" },
  { long = "abbrev", value = { takes = "inert" } },
]

# Not the diff options range-diff forwards: --output writes a file and
# --ext-diff runs a configured program.
[[row]]
key = ["git", "range-diff"]
source = "https://git-scm.com/docs/git-range-diff"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
rest = "path"
opt = [
  { long = "creation-factor", value = { takes = "inert" } },
  { long = "no-dual-color" },
  { long = "no-color" },
  { short = "s", long = "no-patch" },
  { long = "stat" },
]

[[row]]
key = ["gh", "search"]
source = "https://cli.github.com/manual/gh_search"
cwd_sensitive = true
order = "permute"
dashdash = "ends"

# Not --web: it opens a browser. Not -R/--repo: it can send the token to another
# host; narrow with a repo: term in the query instead.
# Query words take "path" so gh-url-operand sees a URL operand; -q/--jq is listed
