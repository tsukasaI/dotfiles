# Not "ask": an unresolved Ask stalls an autonomous session, and Ask is not a
# reliable control under bypassPermissions.
ask_outcome = "deny"

# Left out: -f/--from-file, -L/--library-path, --slurpfile/--rawfile (read
# other files), --arg/--argjson (two values each, which the grammar cannot
# express), --args/--jsonargs, --seq, --stream*.
[[row]]
key = ["jq"]
source = "https://jqlang.org/manual/v1.8/#invoking-jq"
order = "permute"
dashdash = "ends"
positionals = ["inert"]
rest = "path"
[[row.opt]]
short = "n"
long = "null-input"
[[row.opt]]
short = "R"
long = "raw-input"
[[row.opt]]
short = "s"
long = "slurp"
[[row.opt]]
short = "c"
long = "compact-output"
[[row.opt]]
short = "r"
long = "raw-output"
[[row.opt]]
long = "raw-output0"
[[row.opt]]
short = "j"
long = "join-output"
[[row.opt]]
short = "a"
long = "ascii-output"
[[row.opt]]
short = "S"
long = "sort-keys"
[[row.opt]]
short = "C"
long = "color-output"
[[row.opt]]
short = "M"
long = "monochrome-output"
[[row.opt]]
long = "tab"
[[row.opt]]
long = "indent"
value = { takes = "inert" }
[[row.opt]]
long = "unbuffered"
[[row.opt]]
short = "e"
long = "exit-status"

# Not -r/-f/-j: -r reads a file's mtime and -f/-j parse input. A clock-setting
# operand passes the row but fails without root.
[[row]]
key = ["date"]
source = "https://man.freebsd.org/cgi/man.cgi?query=date"
order = "strict"
dashdash = "literal"
plus_words = "operand"
positionals = ["inert"]
opt = [{ short = "u" }]

# No operand and no option: `shguard init` writes a config and `shguard check`
# reads arbitrary files.
[[row]]
key = ["shguard"]
source = "https://github.com/tsukasaI/shguard#readme"
order = "strict"
dashdash = "literal"

[[row]]
key = ["diagram-render"]
source = "https://github.com/tsukasaI/dotfiles/blob/main/claude-code/skills/diagram-explain/render.ts"
cwd_sensitive = true
order = "permute"
dashdash = "literal"
positionals = ["path"]
opt = [
  { long = "root", value = { takes = "path" } },
  { long = "out", value = { takes = "path" } },
]

[[row]]
key = ["explain-plan-render"]
source = "https://github.com/tsukasaI/dotfiles/blob/main/claude-code/skills/explain-plan/plan.ts"
cwd_sensitive = true
order = "permute"
dashdash = "literal"
positionals = ["path"]
opt = [
  { long = "root", value = { takes = "path" } },
  { long = "out", value = { takes = "path" } },
]

# No rows on purpose: `git checkout` (a branch and `-- path`, which discards
# edits, share one operand slot), `git restore` (a row cannot require
# --staged; unstage with `git reset -- <path>`), `git clean`, `git rm`,
# `git gc`, `git reflog`, `git update-ref`, `git filter-branch`. `git branch`
# keeps the embedded listing-only row (a second row with the same key is a
# load error), so branches are made with `git switch -c`.

[[row]]
key = ["git", "reset"]
source = "https://git-scm.com/docs/git-reset"
cwd_sensitive = true
order = "permute"
dashdash = "ends"
rest = "path"
opt = [
  { long = "soft" },
  { long = "mixed" },
  { short = "q", long = "quiet" },
  { long = "hard" },
  { long = "merge" },
  { long = "keep" },
]

