# shguard user policy for this machine.
#
# Deployed to ~/.config/shguard/config.toml via a setup.sh symlink so it
# stays versioned and CI-testable — shguard itself only reads the resolved
# ~/.config path and has no project-local config discovery, by design.
#
# Schema (see shguard's rules/blocklist.toml for the authoritative version):
#   [[deny]]  - hard-blocks a command shape (id, reason, command/command_prefix,
#               optional required_flags/required_tokens/targets)
#   [[ask]]   - same shape, surfaces a confirmation instead of a hard block
#   [[allow]] - can only downgrade an Ask that shguard's own structural
#               analysis produced; it can never override a deny/ask match,
#               built-in or defined here (see docs/shguard-migration-deltas.md)
#
# Precedence: deny > ask > allow, evaluated across the built-in blocklist and
# this file together.
#
# This file ports claude-code/hooks/blocklist.conf's categories that aren't
# already covered by shguard's built-in blocklist (rules/blocklist.toml).
# Every `dotfiles-*` id below is namespaced to avoid colliding with a
# built-in id (merge_user_config is additive-only: an id collision is a
# load-time error, not an override).
#
# What's deliberately NOT here — see docs/shguard-migration-deltas.md for
# the full list and reasoning: pipe-to-interpreter beyond the built-in
# curl|wget -> sh pipeline, heredoc-fed interpreters (python <<EOF etc.),
# the ANSI-C $'...' raw-string check, /dev/tcp|udp for arbitrary commands,
# the general CREDENTIAL "any command mentioning secret/credential" case,
# and full secret-file-reader path coverage (extension-suffix patterns
# like *.pem/*.key aren't expressible with exact/prefix target matching).
#
# curl-localhost-only / rsync-local-only are ALSO deliberately absent:
# except_targets exists (issue #30, closed) but treats flag values as
# candidate targets, causing a 55% over-ask rate on real local curl usage
# — issue #48, still open, blocks writing these rules until fixed.

# Privilege escalation floor (issue #35, closed in v0.3.0; also fixes
# #36's doas/su/pkexec gap, though that ticket itself is still open due
# to a multi-issue auto-close quirk): denies sudo/doas/su/pkexec/run0
# outright regardless of whether the wrapped command independently trips
# a rule. "allow" is rejected at config load (fail-closed, no way to
# disable this). See docs/shguard-migration-deltas.md #11.
escalation_floor = "deny"

# =====================================================================
# Privilege escalation
# =====================================================================

# NOTE: these three rules are now REDUNDANT (not deactivated) given the
# escalation_floor above (issue #35, closed in v0.3.0): the floor
# denies sudo/doas/su outright via its own mechanism, independent of
# argv[0] rule matching. In practice these rules still "win" the
# reported reason string since they match unconditionally alongside the
# floor (verified live: pkexec, which has no rule here, shows the
# floor's own message; sudo/doas/su show the rule's message instead) —
# net effect is identical (deny) either way. Kept in place anyway as
# documentation of intent — see docs/shguard-migration-deltas.md #11.
[[deny]]
id = "dotfiles-privilege-sudo"
reason = "sudo grants root-level access"
command = "sudo"

[[deny]]
id = "dotfiles-privilege-su"
reason = "su switches to another user account"
command = "su"

[[deny]]
id = "dotfiles-privilege-doas"
reason = "doas grants elevated privileges"
command = "doas"

