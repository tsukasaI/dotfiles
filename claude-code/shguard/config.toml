# =====================================================================
# Allowlisted security scanners (ported from allowlist.conf).
# These tools legitimately read secret-looking files as their normal job.
# NOTE: this is NOT an override mechanism — [[allow]] can never rescue a
# match against a deny rule above. It works here only because none of the
# targets lists above match these four tools' own argv[0] (secretlint/
# detect-secrets/gitleaks/trufflehog aren't cat/head/tail/etc., and none of
# the other deny rules' command names match them either). Kept as explicit
# [[allow]] entries for documentation/audit-trail purposes and to downgrade
# any structural Ask shguard's parser might otherwise raise on their
# invocations (e.g. an argument containing "$(...)").
# =====================================================================

[[allow]]
id = "dotfiles-allow-secretlint"
reason = "secretlint is a secret-scanning tool, not a threat"
