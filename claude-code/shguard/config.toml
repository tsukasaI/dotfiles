# =====================================================================
# Rules: git/gh operations that lose work for good.
# =====================================================================

[[rule]]
id = "dotfiles-git-reset-discard-worktree"
key = ["git", "reset"]
opts = [["--hard", "--merge", "--keep"]]
outcome = "block"

[[rule]]
id = "dotfiles-git-switch-discard"
key = ["git", "switch"]
opts = [["-f", "--force", "--discard-changes"]]
outcome = "block"

[[rule]]
id = "dotfiles-git-worktree-remove-force"
key = ["git", "worktree", "remove"]
opts = [["-f", "--force"]]
outcome = "block"

[[rule]]
id = "dotfiles-git-tag-delete"
key = ["git", "tag"]
opts = [["-d", "--delete"]]
outcome = "block"

[[rule]]
id = "dotfiles-gh-pr-checkout-force"
key = ["gh", "pr", "checkout"]
opts = [["-f", "--force"]]
outcome = "block"

[[rule]]
id = "dotfiles-gh-pr-merge-admin"
key = ["gh", "pr", "merge"]
opts = [["--admin"]]
outcome = "block"

# Same as dotfiles-git-push-url-target: a URL or scp-form remote pulls
# code from a host the repository's remotes may not name.
[[rule]]
id = "dotfiles-git-fetch-url-remote"
key = ["git", "fetch"]
targets = [
  { pat = "https:", kind = "prefix" },
  { pat = "http:", kind = "prefix" },
  { pat = "ssh:", kind = "prefix" },
  { pat = "git:", kind = "prefix" },
  { pat = "file:", kind = "prefix" },
  { pat = "ext::", kind = "prefix" },
  { pat = "git@", kind = "prefix" },
]
outcome = "block"

[[rule]]
id = "dotfiles-git-pull-url-remote"
key = ["git", "pull"]
targets = [
  { pat = "https:", kind = "prefix" },
  { pat = "http:", kind = "prefix" },
  { pat = "ssh:", kind = "prefix" },
  { pat = "git:", kind = "prefix" },
  { pat = "file:", kind = "prefix" },
  { pat = "ext::", kind = "prefix" },
  { pat = "git@", kind = "prefix" },
]
outcome = "block"

# Same as dotfiles-rename-protected-ancestor-cp: renaming a protected
# directory away defeats path-literal protection.
[[rule]]
id = "dotfiles-rename-protected-ancestor-git-mv"
key = ["git", "mv"]
targets = [
  { pat = "claude-code", kind = "under" },
  { pat = ".claude", kind = "under" },
  { pat = ".git", kind = "under" },
]
outcome = "block"

# gh runs outside the Bash sandbox (sandbox.excludedCommands), so a
# --body-file is uploaded with no read restriction. A rule cannot say "only
# under /private/tmp", so every other root entry is listed; a new root
# directory needs root on macOS (sealed system volume). The `/.vol`,
# `/.resolve` and `/.nofollow` entries are aliases that reach any file. Not
# expressible: a basename at any depth (`sub/.env`).
[[rule]]
id = "dotfiles-gh-upload-path"
key = ["gh"]
targets = [
  { pat = "/.vol", kind = "under" },
  { pat = "/.resolve", kind = "under" },
  { pat = "/.nofollow", kind = "under" },
  { pat = "/.file", kind = "under" },
  { pat = "/Applications", kind = "under" },
  { pat = "/bin", kind = "under" },
  { pat = "/cores", kind = "under" },
  { pat = "/dev", kind = "under" },
  { pat = "/etc", kind = "under" },
  { pat = "/home", kind = "under" },
  { pat = "/Library", kind = "under" },
  { pat = "/nix", kind = "under" },
  { pat = "/opt", kind = "under" },
  { pat = "/pkg", kind = "under" },
  { pat = "/run", kind = "under" },
  { pat = "/sbin", kind = "under" },
  { pat = "/System", kind = "under" },
  { pat = "/Users", kind = "under" },
  { pat = "/usr", kind = "under" },
  { pat = "/var", kind = "under" },
  { pat = "/Volumes", kind = "under" },
  { pat = "/private/etc", kind = "under" },
  { pat = "/private/var", kind = "under" },
  { pat = "/private/tftpboot", kind = "under" },
  { pat = "~", kind = "prefix" },
  { pat = "..", kind = "under" },
  { pat = ".env", kind = "prefix" },
]
outcome = "block"
