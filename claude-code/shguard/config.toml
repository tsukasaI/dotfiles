# =====================================================================
# Shell escape / code injection
#
# Shell interpreters get BLANKET deny rules (no required_flags): every
# invocation is denied, both `<shell> script.sh` (shguard doesn't read the
# file) and `<shell> -c '<string>'`. Since shguard #695 a user deny on an
# interpreter or eval is honored even though shguard also recurses into the
# -c/eval string; before that, the recursion's early return skipped the deny
# and `bash -c`/`eval` were silently allowed. Don't narrow these to
