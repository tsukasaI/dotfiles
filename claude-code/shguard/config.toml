  { short = "C", long = "force-create", value = { takes = "inert" } },
  { short = "d", long = "detach" },
  { short = "t", long = "track" },
  { long = "no-track" },
  { short = "q", long = "quiet" },
  { short = "f", long = "force" },
  { long = "discard-changes" },
]

[[row]]
