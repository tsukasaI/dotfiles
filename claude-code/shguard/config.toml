reason = "gh api -XDELETE / --method=DELETE issues a destructive HTTP DELETE request"
command = "gh"
required_tokens = ["api"]
required_flags = ["-XDELETE|-Xdelete|-XDelete|--method=DELETE|--method=delete|--method=Delete"]

