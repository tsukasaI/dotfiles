# =====================================================================
# Shell escape / code injection
#
# bash/sh/zsh/dash get a BLANKET rule below (no required_flags), not a
# `-c`-scoped one: shguard unwraps `command -c '<string>'` for these four
# and recurses into the inner command's own safety (confirmed: `bash -c
# 'rm -rf /'` -> deny via the built-in rm-rf rule; `bash -c 'grep foo bar'`
# -> deny via dotfiles-tool-policy-grep below; `bash -c 'echo hi'` ->
# allow), so a `required_flags = ["c"]` rule would be unreachable dead code
# for the -c case specifically. But bare `bash script.sh` (no -c, a script
# FILE reference) is NOT recursed into — shguard doesn't read the file —
# and was uncovered entirely until this blanket rule was added (found via
# the migration's parity check: `ba'sh' script.sh` was silently allowed).
# Verified the blanket form coexists correctly with -c recursion (doesn't
# make `bash -c 'echo hi'` start denying) and, as a bonus, closes the
# newline-as-separator gap in the old hook's STRICT_CB check (issue #44):
# `echo setup` + newline + `bash script.sh` now denies, because shguard's
# real parser (unlike regex boundary classes) treats the newline as an
# actual command separator and evaluates `bash script.sh` on its own.
# ksh/fish -c are NOT unwrapped (brush-parser doesn't parse their
# dialects), so they keep the narrower `-c`-scoped rules below instead.
# =====================================================================

[[deny]]
id = "dotfiles-code-eval"
reason = "eval executes arbitrary strings as shell code"
command = "eval"

[[deny]]
id = "dotfiles-code-bash"
reason = "bash script.sh executes an unreviewed script file; bash -c is handled by shguard's own recursion into the inner command"
command = "bash"

[[deny]]
id = "dotfiles-code-sh"
reason = "sh script.sh executes an unreviewed script file; sh -c is handled by shguard's own recursion into the inner command"
command = "sh"

[[deny]]
id = "dotfiles-code-zsh"
reason = "zsh script.sh executes an unreviewed script file; zsh -c is handled by shguard's own recursion into the inner command"
command = "zsh"

[[deny]]
id = "dotfiles-code-dash"
reason = "dash script.sh executes an unreviewed script file; dash -c is handled by shguard's own recursion into the inner command"
command = "dash"

[[deny]]
id = "dotfiles-code-ksh-c"
reason = "ksh -c executes an arbitrary script string"
command = "ksh"
required_flags = ["c"]

[[deny]]
id = "dotfiles-code-fish-c"
