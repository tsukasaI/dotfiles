# Redirect writes into files that unsandboxed processes execute. Defense in
# depth: Claude Code runs a line with a redirect or pipe inside the sandbox
# even when its command is in sandbox.excludedCommands (verified 2026-09-26),
# so sandbox.filesystem.denyWrite is the primary control. shguard accepts
# case_insensitive only on normalized/normalized_prefix, so only the absolute
# forms fold case; the relative and basename forms are case-sensitive.
[[redirect]]
id = "dotfiles-redirect-live-config"
reason = "redirect into a dotfiles path that an unsandboxed process executes (hooks, lefthook, tests, git/ssh/zsh/nvim/mise config, .git remotes)"
decision = "block"
targets = [
  { normalized_basename = "lefthook.yaml" },
  { normalized_basename = "lefthook.yml" },
  { normalized_basename = "lefthook.json" },
  { normalized_basename = "lefthook.toml" },
  { normalized_basename = "lefthook-local.yaml" },
  { normalized_basename = "lefthook-local.yml" },
  { normalized_basename = "lefthook-local.json" },
  { normalized_basename = "lefthook-local.toml" },
  { normalized_basename = ".lefthook.yaml" },
  { normalized_basename = ".lefthook.yml" },
  { normalized_basename = ".lefthook.json" },
  { normalized_basename = ".lefthook.toml" },
  { normalized_basename = ".lefthook-local.yaml" },
  { normalized_basename = ".lefthook-local.yml" },
  { normalized_basename = ".lefthook-local.json" },
  { normalized_basename = ".lefthook-local.toml" },
  { normalized_prefix = "~/dotfiles/", case_insensitive = true },
  { normalized_prefix = "/Users/inouetsukasa/dotfiles/", case_insensitive = true },
  # Relative forms: shguard has no cwd, so these are raw prefixes that assume
  # the repo root as cwd. `../`-ascent forms fall to shguard's own
  # unknown-cwd floor.
  { prefix = "tests/" }, { prefix = "./tests/" },
  { prefix = "git/" }, { prefix = "./git/" },
  { prefix = "ssh/" }, { prefix = "./ssh/" },
  { prefix = "zsh/" }, { prefix = "./zsh/" },
  { prefix = "nvim/" }, { prefix = "./nvim/" },
  { prefix = "wezterm/" }, { prefix = "./wezterm/" },
  { prefix = "ghostty/" }, { prefix = "./ghostty/" },
  { prefix = "karabiner/" }, { prefix = "./karabiner/" },
  { prefix = "nix-darwin/" }, { prefix = "./nix-darwin/" },
  { prefix = "claude-code/" }, { prefix = "./claude-code/" },
  { prefix = "mise/" }, { prefix = "./mise/" },
  { prefix = ".git/" }, { prefix = "./.git/" },
  { prefix = ".lefthook/" }, { prefix = ".lefthook-local/" },
  { exact = "setup.sh" }, { exact = "./setup.sh" },
]

# git push --repo=<url|path> overrides the remote positional. It already falls
# outside sandbox.excludedCommands (runs sandboxed); defense in depth.
[[deny]]
id = "dotfiles-git-push-repo-flag"
reason = "git push --repo names an arbitrary destination instead of a configured remote"
command = "git"
required_tokens = ["push"]
required_flags = ["--repo"]

