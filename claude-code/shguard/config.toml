# Renaming, linking or copying over a directory that CONTAINS protected paths
# defeats path-literal protection (Seatbelt denyWrite and Claude Code's own
# .git/config, .git/hooks, .claude/settings*.json checks): rename it away,
# edit inside, rename it back. Renaming a denyWrite path itself is already
# denied by Seatbelt; these rules cover the unlisted ancestors, in either
# direction and in any repo. Python/node rename() from a sandboxed script is
# not covered (accepted, see docs/shguard-migration-deltas.md #26).
[[deny]]
id = "dotfiles-rename-protected-ancestor-mv"
reason = "mv of .git/.claude/claude-code swaps a directory holding protected files"
command = "mv"
targets = [{ normalized_basename = ".git" }, { normalized_basename = ".claude" }, { normalized_basename = "claude-code" }]

[[deny]]
id = "dotfiles-rename-protected-ancestor-git-mv"
reason = "git mv of .claude/claude-code swaps a directory holding protected files"
command = "git"
required_tokens = ["mv"]
targets = [{ normalized_basename = ".git" }, { normalized_basename = ".claude" }, { normalized_basename = "claude-code" }]

[[deny]]
id = "dotfiles-rename-protected-ancestor-ln"
reason = "ln onto .git/.claude/claude-code substitutes a directory holding protected files"
command = "ln"
targets = [{ normalized_basename = ".git" }, { normalized_basename = ".claude" }, { normalized_basename = "claude-code" }]

[[deny]]
id = "dotfiles-rename-protected-ancestor-cp"
reason = "cp onto or out of .git/.claude/claude-code recreates a directory holding protected files"
command = "cp"
targets = [{ normalized_basename = ".git" }, { normalized_basename = ".claude" }, { normalized_basename = "claude-code" }]

[[deny]]
id = "dotfiles-rename-protected-ancestor-ditto"
reason = "ditto onto .git/.claude/claude-code recreates a directory holding protected files"
command = "ditto"
targets = [{ normalized_basename = ".git" }, { normalized_basename = ".claude" }, { normalized_basename = "claude-code" }]

