required_flags = ["f|--force"]

# Remote and config edits redirect where an unsandboxed push/fetch goes or
# what it runs. Read forms (git remote -v/get-url, git config <key> reads of
# other keys) stay allowed. Key matching is case-sensitive (`prefix` has no
# case_insensitive option, and git keys are case-insensitive), so only the
# two common spellings of the hook/command keys are listed.
[[deny]]
id = "dotfiles-git-remote-add"
reason = "git remote add registers a new push/fetch destination"
command = "git"
required_tokens = ["remote", "add"]

[[deny]]
id = "dotfiles-git-remote-set-url"
reason = "git remote set-url repoints a remote at another destination"
command = "git"
required_tokens = ["remote", "set-url"]

[[deny]]
id = "dotfiles-git-remote-rename"
reason = "git remote rename changes the remote that push/fetch rules and hooks name"
command = "git"
required_tokens = ["remote", "rename"]

[[deny]]
id = "dotfiles-git-config-dangerous-keys"
reason = "git config of core.hooksPath/sshCommand/fsmonitor or remote.*/url.*/credential.*/include.* makes git run a chosen command or redirects its network target"
command = "git"
required_tokens = ["config"]
targets = [
  { prefix = "core.hooksPath" }, { prefix = "core.hookspath" },
  { prefix = "core.sshCommand" }, { prefix = "core.sshcommand" },
  { prefix = "core.fsmonitor" },
  { prefix = "remote." }, { prefix = "url." }, { prefix = "credential." },
  { prefix = "include." }, { prefix = "includeIf." }, { prefix = "includeif." },
]

[[deny]]
id = "dotfiles-git-config-scope-edit"
reason = "git config --global/--system/-e/--edit changes configuration shared beyond this repository"
command = "git"
required_tokens = ["config"]
required_flags = ["--global|--system|e|--edit"]

