# `command = "grep"` above only matches grep as argv[0] — it doesn't fire
# when grep is invoked as a git subcommand (`git grep`, `git -C dir grep`).
# The old hook's bare-word match caught this via substring scanning; this
# rule ports that specific case. `required_tokens` is positional, so it
# still misses `git -C dir grep` (a non-flag token before the subcommand) —
# see docs/shguard-migration-deltas.md #21.
[[deny]]
id = "dotfiles-tool-policy-git-grep"
reason = "git grep — parity with the old hook's bare-word \"grep\" match; prefer rg or the built-in Grep tool"
command = "git"
required_tokens = ["grep"]

[[deny]]
id = "dotfiles-tool-policy-find"
