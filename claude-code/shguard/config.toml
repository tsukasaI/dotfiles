required_tokens = ["pull"]
required_flags = ["--upload-pack"]

[[deny]]
id = "dotfiles-git-ls-remote-upload-pack"
reason = "git ls-remote --upload-pack (or its hidden alias --exec) runs a chosen command"
command = "git"
required_tokens = ["ls-remote"]
required_flags = ["--upload-pack|--exec"]

# clone/archive run inside the sandbox (not in excludedCommands), but the
