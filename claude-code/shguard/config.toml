  { short = "t", long = "template", value = { takes = "inert" } },
  { short = "L", long = "limit", value = { takes = "inert" } },
  { long = "state", value = { takes = "inert" } },
  { long = "sort", value = { takes = "inert" } },
  { long = "order", value = { takes = "inert" } },
]

