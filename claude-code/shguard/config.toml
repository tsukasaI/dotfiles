# =====================================================================
# Network
# =====================================================================

[[deny]]
id = "dotfiles-network-curl-remote"
reason = "curl to a non-localhost address can exfiltrate data"
command = "curl"
# Never add K/--config here: its file can carry `url =` targets, so the
# flag's value is itself a network destination (deltas #23).
value_flags = ["o", "w", "m", "d", "X", "H", "A", "e", "u", "b", "c", "T", "F"]
attached_value_flags = ["x"]
except_targets = [
  # url_host only — never add exact/prefix entries alongside: except_targets
  # are OR'd, and a retained prefix entry reopens the userinfo bypass this
  # fix closes (see #23 in docs/shguard-migration-deltas.md). Scheme-blind
  # by design (excepts http/https/ws/wss/ftp alike).
  { url_host = "localhost" },
  { url_host = "127.0.0.1" },
  { url_host = "[::1]" },
]
[[deny]]
id = "dotfiles-network-rsync-remote"
reason = "rsync to/from a remote host can transfer files over the network"
command = "rsync"
value_flags = ["exclude"]
except_targets = [
  { prefix = "/" },
  { prefix = "./" },
  { prefix = "../" },
  { prefix = "~" },
  { exact = "." },
]

