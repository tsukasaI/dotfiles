[[rule]]
id = "dotfiles-file-rm"
key = ["rm"]
outcome = "block"

# Not URL prefixes too: the catalog already asks URL and absolute-path
# remotes, and misses only the scp form (`git@host:path`) and `.`.
[[rule]]
id = "dotfiles-git-push-url-target"
key = ["git", "push"]
targets = [
  { pat = "git@", kind = "prefix" },
  { pat = ".", kind = "exact" },
]
outcome = "block"

# Not .git or .claude: the catalog already blocks cp onto or out of them.
[[rule]]
id = "dotfiles-rename-protected-ancestor-cp"
key = ["cp"]
targets = [{ pat = "claude-code", kind = "under" }]
outcome = "block"

# The catalog asks `~/...` credential paths but has no HOME, so the absolute
# spelling needs its own targets. grep gets no bare names (the pattern is a
# path word, so `grep id_rsa` would hit), and rg gets no rule (rg-ask-broad
# already asks every /Users path).
[[rule]]
id = "dotfiles-secret-read-cat"
key = ["cat"]
outcome = "block"
targets = [
  { pat = "/Users/inouetsukasa/.ssh", kind = "under" },
  { pat = "/Users/inouetsukasa/.gnupg", kind = "under" },
  { pat = "/Users/inouetsukasa/.aws", kind = "under" },
  { pat = "/Users/inouetsukasa/.config/gh", kind = "under" },
  { pat = "/Users/inouetsukasa/.config/gcloud", kind = "under" },
  { pat = "/Users/inouetsukasa/.claude", kind = "under" },
  { pat = "/Users/inouetsukasa/.claude.json", kind = "exact" },
  { pat = "/Users/inouetsukasa/.kube", kind = "under" },
  { pat = "/Users/inouetsukasa/.docker", kind = "under" },
  { pat = "/Users/inouetsukasa/.netrc", kind = "exact" },
  { pat = "/Users/inouetsukasa/.npmrc", kind = "exact" },
  { pat = "/Users/inouetsukasa/.pypirc", kind = "exact" },
  { pat = "/Users/inouetsukasa/.pgpass", kind = "exact" },
  { pat = "/Users/inouetsukasa/.zsh_history", kind = "exact" },
  { pat = "/Users/inouetsukasa/.bash_history", kind = "exact" },
  { pat = "/Users/inouetsukasa/.pi/agent/auth.json", kind = "exact" },
  { pat = "id_rsa", kind = "exact" },
  { pat = "id_ed25519", kind = "exact" },
  { pat = "id_ecdsa", kind = "exact" },
  { pat = "id_dsa", kind = "exact" },
  { pat = "kubeconfig", kind = "exact" },
  { pat = ".kube", kind = "under" },
  { pat = ".npmrc", kind = "exact" },
  { pat = ".netrc", kind = "exact" },
  { pat = ".pgpass", kind = "exact" },
  { pat = ".aws", kind = "under" },
  { pat = ".docker/config.json", kind = "exact" },
  { pat = ".config/gcloud", kind = "under" },
]

