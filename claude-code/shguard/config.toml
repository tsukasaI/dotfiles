# ask_outcome: floor every terminal Ask (structural fallback and rule-authored
# alike) to a deny, in every permission_mode including default/plan/acceptEdits.
# Using the bare-string form (not the [ask_outcome] table) deliberately: the
# table leaves an absent/unrecognized permission_mode resolved to "ask", which
# is a silent no-op if Claude Code ever renames/drops that hook field - a
# fail-open gap the bare form doesn't have. An unresolved Ask can't be acted
# on by an autonomous/auto-mode session anyway, and Ask is not a reliable
# control under bypassPermissions (see docs/shguard-migration-deltas.md's
# "Cutover caveat"), so flooring unconditionally is the correct fail-closed
# read of this file's own security posture, not a weakening of it.
ask_outcome = "deny"

# shguard user policy for this machine.
#
# Deployed to ~/.config/shguard/config.toml (shguard's default lookup path)
# via a setup.sh symlink so it stays versioned and CI-testable. The
# PreToolUse hook in settings.json runs bare `shguard`, which reads that path.
#
# Schema (see shguard's rules/blocklist.toml for the authoritative version):
#   [[deny]]  - hard-blocks a command shape (id, reason, command/command_prefix,
#               optional required_flags/required_tokens/targets)
#   [[ask]]   - same shape, surfaces a confirmation instead of a hard block
#   [[allow]] - can only downgrade an Ask that shguard's own structural
#               analysis produced; it can never override a deny/ask match,
#               built-in or defined here (see docs/shguard-migration-deltas.md)
#
# Precedence: deny > ask > allow, evaluated across the built-in blocklist and
# this file together.
#
# This file ports the old blocklist.conf's categories (file since deleted) that aren't
# already covered by shguard's built-in blocklist (rules/blocklist.toml).
# Every `dotfiles-*` id below is namespaced to avoid colliding with a
# built-in id (merge_user_config is additive-only: an id collision is a
# load-time error, not an override).
#
# What's deliberately NOT here — see docs/shguard-migration-deltas.md for
# the full list and reasoning: pipe-to-interpreter beyond the built-in
# curl|wget -> sh pipeline, heredoc-fed interpreters (python <<EOF etc.),
# the ANSI-C $'...' raw-string check, /dev/tcp|udp for arbitrary commands,
# the general CREDENTIAL "any command mentioning secret/credential" case,
# and full secret-file-reader path coverage (extension-suffix patterns
# like *.pem/*.key aren't expressible with exact/prefix target matching).
#
# curl (localhost-only) / rsync (local-only) rules ARE included below
# (dotfiles-network-curl-remote / dotfiles-network-rsync-remote), using the
# value_flags field — see docs/shguard-migration-deltas.md #2/#19 for history.

# Privilege escalation floor (issue #35): denies sudo/doas/su/pkexec/run0
# outright regardless of whether the wrapped command independently trips
# a rule. "allow" is rejected at config load (fail-closed, no way to
# disable this). See docs/shguard-migration-deltas.md #11.
escalation_floor = "deny"

